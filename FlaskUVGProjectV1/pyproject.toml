[project]
name = "uvg-collections"
version = "1.0.0"
description = "Sistema de gestión para Colecciones Biológicas UVG con inventario, solicitudes, movimientos, soporte para Barcode y RFID."
requires-python = ">=3.14"

dependencies = [
    "Flask",
    "Flask-Cors",
    "Flask-Login",
    "Flask-Migrate",
    "Flask-SQLAlchemy",
    "SQLAlchemy",
    "alembic",
    "psycopg2-binary",
    "Werkzeug",
    "gunicorn",
    "resend",
    "python-dateutil",
    "tzdata",
    "Pillow",
    "numpy",
    "pandas",
    "matplotlib"
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["flaskr"]