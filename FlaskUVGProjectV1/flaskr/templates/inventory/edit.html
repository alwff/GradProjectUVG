{% extends 'base.html' %}

{% block title %}Editar Espécimen{% endblock %}

{% block content %}

<div class="inventory-form-header">

    <h1>
        Editar Espécimen
    </h1>

    <a
        class="small-button"
        href="{{ url_for('inventory.index') }}"
    >
        ← Volver al Inventario
    </a>

</div>

<form method="post">

    <label>Código Portal</label>
    <input
        name="portal_code"
        value="{{ specimen.portal_code }}"
        required
    >

    <label>Número de Catálogo</label>
    <input
        name="catalog_number"
        value="{{ specimen.catalog_number }}"
    >

    <label>Nombre Científico</label>
    <input
        name="scientific_name"
        value="{{ specimen.scientific_name }}"
        required
    >

    <label>Familia Taxonómica</label>
    <input
        name="taxon_family"
        value="{{ specimen.taxon_family }}"
    >

    <label>Colección</label>
    <input
        name="collection"
        value="{{ specimen.collection }}"
        required
    >

    <label>RFID EPC</label>
    <input
        name="rfid_epc"
        value="{{ specimen.rfid_epc or '' }}"
    >

    <label>Código de Barras</label>
    <input
        name="barcode"
        value="{{ specimen.barcode or '' }}"
    >

    <label>Descripción</label>
    <textarea
        name="description"
    >{{ specimen.description }}</textarea>

    <input
        class="inventory-save-button"
        type="submit"
        value="Guardar Cambios"
    >

</form>

{% endblock %}
