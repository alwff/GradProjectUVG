{% extends 'base.html' %}

{% block title %}
Registrar Entrada
{% endblock %}

{% block content %}

<h1>
    Registrar Entrada
</h1>

<form method="post">

    <label>
        Código Portal
    </label>

    <input
        name="portal_code"
        required
        autofocus
    >

    <label>
        Observaciones
    </label>

    <textarea
        name="notes"
    ></textarea>

    <input
        type="submit"
        value="REGISTRAR ENTRADA"
    >

</form>

{% endblock %}
